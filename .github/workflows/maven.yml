# ==============================================================
# GitHub Actions CI Pipeline for Spring Boot Application
#
# This workflow:
# 1. Triggers on push and pull request to the main branch.
# 2. Starts a PostgreSQL container.
# 3. Builds and tests the Spring Boot application.
# 4. Uploads the generated JAR as an artifact.
# 5. Downloads the JAR.
# 6. Builds the Docker image.
#
# Future enhancements:
# - Push Docker image to Docker Hub / AWS ECR.
# - Deploy to EC2 / ECS / EKS.
# ==============================================================

name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # Job 1 - Build and Test
  # ============================================================
  maven-build:

    runs-on: ubuntu-latest

    # PostgreSQL container used by integration tests
    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: payhub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d payhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # Install Java
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Build project and execute tests
      - name: Build with Maven
        run: mvn clean package

      # Upload generated JAR for the next job
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

  # ============================================================
  # Job 2 - Docker Build
  # Runs only if Maven build succeeds
  # ============================================================
  docker-build:

    needs: maven-build

    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # Download JAR generated by previous job
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      # Verify downloaded files (optional, useful for debugging)
      - name: Verify downloaded files
        run: ls -lh target

      # Build Docker image
      - name: Build Docker image
        run: docker build -t payhub-backend:latest .
